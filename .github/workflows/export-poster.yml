name: Export SHL LinkedIn poster

on:
  push:
    branches: [main]
    paths:
      - 'poster.html'
      - 'assets/**'
      - 'export.js'
      - '.github/workflows/export-poster.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shl-poster-export
  cancel-in-progress: true

jobs:
  render-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Export 1080x1350 PNG
        run: npm run export
      - name: Verify dimensions and image size
        run: |
          file shl-sara-huang-linkedin.png
          test -s shl-sara-huang-linkedin.png
      - name: Commit refreshed poster image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shl-sara-huang-linkedin.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh SHL LinkedIn poster image"
            git push
          fi
